<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Nine Banners emblem">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b1c2e"/>
      <stop offset="1" stop-color="#4a0d18"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d27a"/>
      <stop offset="0.5" stop-color="#c99a3c"/>
      <stop offset="1" stop-color="#7a5918"/>
    </linearGradient>
    <linearGradient id="bannerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a5a"/>
      <stop offset="1" stop-color="#0b1230"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Two crossed banner staves behind -->
  <g transform="translate(128 132)" filter="url(#softShadow)">
    <g transform="rotate(-18)">
      <rect x="-3" y="-96" width="6" height="192" rx="2" fill="url(#goldGrad)"/>
      <circle cx="0" cy="-96" r="6" fill="url(#goldGrad)"/>
      <path d="M3 -88 L58 -88 L50 -70 L58 -52 L3 -52 Z" fill="url(#bannerGrad)" stroke="#c99a3c" stroke-width="1.5"/>
    </g>
    <g transform="rotate(18)">
      <rect x="-3" y="-96" width="6" height="192" rx="2" fill="url(#goldGrad)"/>
      <circle cx="0" cy="-96" r="6" fill="url(#goldGrad)"/>
      <path d="M-58 -88 L-3 -88 L-3 -52 L-58 -52 L-50 -70 Z" fill="url(#bannerGrad)" stroke="#c99a3c" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Central heater shield -->
  <g filter="url(#softShadow)">
    <path d="M128 40
             L208 60
             L208 132
             C208 176 170 210 128 224
             C86 210 48 176 48 132
             L48 60 Z"
          fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
    <!-- inner border -->
    <path d="M128 52
             L198 68
             L198 130
             C198 168 164 198 128 210
             C92 198 58 168 58 130
             L58 68 Z"
          fill="none" stroke="#c99a3c" stroke-width="1.2" opacity="0.55"/>

    <!-- IX numeral -->
    <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" text-anchor="middle" fill="url(#goldGrad)">
      <text x="128" y="162" font-size="96" letter-spacing="-2">IX</text>
    </g>
  </g>

  <!-- Top chevron ornament -->
  <path d="M88 54 L128 34 L168 54" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
</svg>
