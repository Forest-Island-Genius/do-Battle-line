<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-label="NINE BANNERS">
  <defs>
    <linearGradient id="wmGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d884"/>
      <stop offset="0.5" stop-color="#d3a84a"/>
      <stop offset="1" stop-color="#8a6518"/>
    </linearGradient>
    <linearGradient id="wmCrimson" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d92b44"/>
      <stop offset="1" stop-color="#7a0d1c"/>
    </linearGradient>
    <filter id="wmShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Left flourish -->
  <g stroke="url(#wmGold)" stroke-width="2" fill="none" opacity="0.9">
    <path d="M20 90 L110 90"/>
    <path d="M90 80 L110 90 L90 100" stroke-linecap="round"/>
    <circle cx="20" cy="90" r="3" fill="url(#wmGold)" stroke="none"/>
  </g>

  <!-- Right flourish -->
  <g stroke="url(#wmGold)" stroke-width="2" fill="none" opacity="0.9">
    <path d="M610 90 L700 90"/>
    <path d="M630 80 L610 90 L630 100" stroke-linecap="round"/>
    <circle cx="700" cy="90" r="3" fill="url(#wmGold)" stroke="none"/>
  </g>

  <!-- Main wordmark -->
  <g font-family="'Cinzel', Georgia, 'Times New Roman', serif" font-weight="800" text-anchor="middle" filter="url(#wmShadow)">
    <text x="360" y="115"
          font-size="86"
          letter-spacing="8"
          fill="url(#wmCrimson)"
          stroke="url(#wmGold)"
          stroke-width="1.8"
          paint-order="stroke">NINE BANNERS</text>
  </g>

  <!-- Subtle top/bottom gold rule -->
  <path d="M140 38 L580 38" stroke="url(#wmGold)" stroke-width="1" opacity="0.5"/>
  <path d="M140 148 L580 148" stroke="url(#wmGold)" stroke-width="1" opacity="0.5"/>
</svg>
